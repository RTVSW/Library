<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Библиотека | Читальный зал</title>
  
  <meta name="theme-color" content="#050508">

  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="shortcut icon" href="favicon.ico">
  
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Manrope:wght@300;400;600&family=Marck+Script&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold: #e8c87a;
      --gold-dim: rgba(232, 200, 122, 0.4);
      --violet: #9b7bb8;
      --violet-dim: rgba(155, 123, 184, 0.3);
      --parchment: #f4e8d3;
      --parchment-dark: #e3d3b8;
      --text-ink: #2b1f14;
      
      --font-head: 'Cinzel', serif;
      --font-body: 'Manrope', sans-serif;
      --font-book: 'Lora', serif;
      --font-hand: 'Marck Script', cursive;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      /* Глубокий градиент как на стойке */
      background: 
        radial-gradient(circle at 10% 90%, rgba(232, 200, 122, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(232, 200, 122, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 50% 30%, #15121c 0%, #030305 80%);
      background-color: #030305;
      font-family: var(--font-body);
      min-height: 100vh;
      /* Включаем прокрутку, так как книга может быть длинной */
      overflow-y: auto; 
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 80px 20px 50px;
    }

    /* ==========================================
       КНОПКА НАЗАД
       ========================================== */
    .back-btn {
      position: fixed;
      top: 20px; left: 20px;
      background: rgba(10, 10, 16, 0.8);
      border: 1px solid var(--violet-dim);
      color: var(--violet);
      padding: 8px 16px; border-radius: 8px;
      font-family: var(--font-body); font-size: 14px;
      cursor: pointer; z-index: 100;
      transition: all 0.3s ease; text-decoration: none;
      backdrop-filter: blur(5px);
    }
    .back-btn:hover {
      color: var(--gold); border-color: var(--gold);
      box-shadow: 0 0 10px var(--gold-dim);
    }

    /* ==========================================
       КНИГА (Реалистичная)
       ========================================== */
    .book-wrapper {
      position: relative;
      width: 100%;
      max-width: 1100px;
      /* Добавим перспективы для реалистичности */
      perspective: 1500px;
      margin-bottom: 40px;
    }

    .book-container {
      position: relative;
      display: flex;
      width: 100%;
      height: 75vh; /* Не на весь экран, чтобы было видно, что она лежит на столе */
      background: #1a120a; /* Кожаный переплет */
      border-radius: 12px;
      padding: 15px; /* Толщина переплета */
      box-shadow: 
        0 40px 80px rgba(0,0,0,0.9), 
        0 10px 20px rgba(0,0,0,0.8),
        inset 0 0 20px rgba(0,0,0,0.8);
      /* Легкий наклон, будто книга лежит перед нами */
      transform: rotateX(5deg);
    }

    /* Обложка (края переплета) */
    .book-container::before {
      content: '';
      position: absolute;
      inset: 0;
      border: 2px solid #2a1f15;
      border-radius: 12px;
      pointer-events: none;
      box-shadow: inset 0 0 15px rgba(232, 200, 122, 0.1);
    }

    /* Корешок по центру */
    .book-spine {
      position: absolute;
      top: 15px; bottom: 15px; left: 50%;
      transform: translateX(-50%);
      width: 60px;
      background: linear-gradient(to right, rgba(0,0,0,0.8), rgba(0,0,0,0.3), rgba(0,0,0,0.8));
      z-index: 5;
      pointer-events: none;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.9);
    }

    /* Страницы */
    .book-page {
      flex: 1;
      background: var(--parchment);
      position: relative;
      display: flex;
      flex-direction: column;
      padding: 30px 40px;
      overflow: hidden;
      /* Имитация старой бумаги с пятнами */
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(180, 150, 120, 0.1) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(180, 150, 120, 0.1) 0%, transparent 40%);
    }

    .book-page.left {
      border-radius: 8px 0 0 8px;
      box-shadow: inset -20px 0 30px -10px rgba(0,0,0,0.4);
    }
    
    .book-page.right {
      border-radius: 0 8px 8px 0;
      box-shadow: inset 20px 0 30px -10px rgba(0,0,0,0.4);
    }

    .book-title-header {
      font-family: var(--font-head);
      color: #4a2e15;
      font-size: 1.6rem;
      text-align: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px solid rgba(74, 46, 21, 0.2);
      letter-spacing: 1px;
    }

    /* Текст с прокруткой */
    .page-content {
      flex: 1;
      overflow-y: auto;
      padding-right: 10px;
      transition: opacity 0.3s ease;
    }
    
    .page-content::-webkit-scrollbar { width: 6px; }
    .page-content::-webkit-scrollbar-track { background: transparent; }
    .page-content::-webkit-scrollbar-thumb { background: rgba(74, 46, 21, 0.3); border-radius: 3px; }

    .chapter-title {
      font-family: var(--font-head);
      color: #6b4a2e;
      font-size: 1.3rem;
      margin-bottom: 20px;
      text-align: center;
      text-transform: uppercase;
    }

    .book-text {
      font-family: var(--font-book);
      color: var(--text-ink);
      font-size: 1.05rem;
      line-height: 1.7;
      text-align: justify;
      hyphens: auto;
    }

    .book-text p {
      margin-bottom: 12px;
      text-indent: 30px;
    }

    .drop-cap {
      float: left;
      font-family: var(--font-head);
      font-size: 3.5rem;
      line-height: 0.8;
      padding-top: 5px;
      padding-right: 10px;
      padding-left: 5px;
      color: #4a2e15;
      text-shadow: 2px 2px 0px rgba(232, 200, 122, 0.3);
    }

    /* ==========================================
       НАВИГАЦИЯ
       ========================================== */
    .nav-controls {
      position: absolute;
      bottom: -40px;
      left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 40px;
      z-index: 10;
    }

    .nav-btn {
      background: linear-gradient(to bottom, #4a2e15, #2b1f14);
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 10px 24px;
      border-radius: 8px;
      font-family: var(--font-head);
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    }

    .nav-btn:hover:not(:disabled) {
      background: linear-gradient(to bottom, #5a3a1f, #3b2a1e);
      box-shadow: 0 0 15px var(--gold-dim);
    }

    .nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      box-shadow: none;
    }

    .page-indicator {
      font-family: var(--font-head);
      color: var(--gold);
      font-size: 1.1rem;
      text-shadow: 0 0 10px #000;
    }

    /* ==========================================
       БЛОК ОТЗЫВОВ (Как закладка в книге)
       ========================================== */
    .reviews-section {
      width: 100%;
      max-width: 900px;
      margin-top: 20px;
      background: rgba(10, 10, 16, 0.85);
      border: 1px solid var(--gold-dim);
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      backdrop-filter: blur(10px);
      position: relative;
    }

    /* Декоративный корешок закладки */
    .reviews-section::before {
      content: '';
      position: absolute;
      top: -20px; left: 50%;
      transform: translateX(-50%);
      width: 40px; height: 20px;
      background: var(--violet);
      border-radius: 5px 5px 0 0;
      box-shadow: 0 0 10px var(--violet-dim);
    }

    .reviews-title {
      font-family: var(--font-head);
      color: var(--gold);
      font-size: 1.4rem;
      text-align: center;
      margin-bottom: 20px;
    }

    .stars-container {
      display: flex;
      justify-content: center;
      gap: 8px;
      font-size: 2rem;
      margin-bottom: 20px;
      cursor: pointer;
    }

    .star {
      color: rgba(255,255,255,0.1);
      transition: all 0.2s ease;
    }

    .star.active {
      color: var(--gold);
      text-shadow: 0 0 15px var(--gold);
      transform: scale(1.1);
    }

    .review-input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }

    .review-input-group textarea {
      flex: 1;
      padding: 15px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--gold-dim);
      border-radius: 8px;
      color: var(--parchment);
      font-family: var(--font-body);
      font-size: 14px;
      resize: vertical;
      min-height: 60px;
      outline: none;
      transition: all 0.3s;
    }

    .review-input-group textarea:focus {
      border-color: var(--violet);
      box-shadow: 0 0 15px var(--violet-dim);
    }

    .review-input-group button {
      background: linear-gradient(to bottom, #4a2e15, #2b1f14);
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 0 30px;
      border-radius: 8px;
      font-family: var(--font-head);
      cursor: pointer;
      transition: all 0.3s;
    }

    .review-input-group button:hover {
      box-shadow: 0 0 15px var(--gold-dim);
    }

    /* Список отзывов */
    .reviews-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-height: 300px;
      overflow-y: auto;
      padding-right: 10px;
    }

    .review-card {
      background: rgba(255,255,255,0.03);
      border-left: 3px solid var(--violet);
      padding: 15px;
      border-radius: 0 8px 8px 0;
    }

    .review-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    .review-author {
      color: var(--gold);
      font-weight: 600;
    }

    .review-stars {
      color: var(--gold);
      letter-spacing: 2px;
    }

    .review-text {
      color: var(--text-main);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .loading-screen {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--parchment);
      color: #4a2e15;
      font-family: var(--font-hand);
      font-size: 1.8rem;
      z-index: 20;
      border-radius: 8px;
    }

    /* Мобильная адаптация */
    @media (max-width: 768px) {
      body { padding: 70px 10px 30px; }
      .book-container { height: 65vh; padding: 10px; transform: none; }
      .book-page.left { display: none; }
      .book-page.right { border-radius: 8px; padding: 20px; box-shadow: none; }
      .book-spine { display: none; }
      .nav-controls { padding: 0 10px; bottom: -50px; }
      .nav-btn { padding: 10px 15px; font-size: 12px; }
      .page-indicator { font-size: 0.9rem; }
      
      .reviews-section { padding: 20px; margin-top: 60px; }
      .review-input-group { flex-direction: column; }
      .review-input-group button { padding: 12px; }
    }
  </style>
</head>
<body>

  <a href="shelf.html" class="back-btn">← На полку</a>

  <!-- Обертка для книги -->
  <div class="book-wrapper">
    <div class="book-container">
      <div class="loading-screen" id="loadingScreen">Открываем страницы...</div>
      
      <div class="book-spine"></div>

      <!-- Левая страница -->
      <div class="book-page left">
        <div class="book-title-header" id="bookTitleLeft">Название</div>
        <div class="page-content">
          <div class="chapter-title" id="chapterTitleLeft"></div>
          <div class="book-text" id="bookTextLeft"></div>
        </div>
      </div>

      <!-- Правая страница -->
      <div class="book-page right">
        <div class="page-content">
          <div class="book-text" id="bookTextRight"></div>
        </div>
      </div>

      <!-- Навигация -->
      <div class="nav-controls">
        <button class="nav-btn" id="prevBtn" disabled>← Назад</button>
        <div class="page-indicator" id="pageIndicator">Глава 0 / 0</div>
        <button class="nav-btn" id="nextBtn" disabled>Вперед →</button>
      </div>
    </div>
  </div>

  <!-- БЛОК ОТЗЫВОВ (внизу под книгой) -->
  <div class="reviews-section">
    <div class="reviews-title">Книга отзывов</div>
    
    <!-- Оценка -->
    <div class="stars-container" id="starRating">
      <span class="star" data-value="1">★</span>
      <span class="star" data-value="2">★</span>
      <span class="star" data-value="3">★</span>
      <span class="star" data-value="4">★</span>
      <span class="star" data-value="5">★</span>
    </div>

    <!-- Поле ввода -->
    <div class="review-input-group">
      <textarea id="reviewText" placeholder="Оставьте свой след в этой книге..."></textarea>
      <button id="submitReview">Оставить отзыв</button>
    </div>

    <!-- Список -->
    <div class="reviews-list" id="reviewsList">
      <!-- Отзывы будут здесь -->
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getDatabase, ref, get, set, push, onValue, query, orderByChild } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAkMWBSQ5-1aJEwmf5ijETE0P0ulE_UOwc",
      authDomain: "library-740b6.firebaseapp.com",
      databaseURL: "https://library-740b6-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "library-740b6",
      storageBucket: "library-740b6.firebasestorage.app",
      messagingSenderId: "386084173741",
      appId: "1:386084173741:web:919c2ebe2c1789d9735324",
      measurementId: "G-SBR8KY5P0C"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    document.addEventListener('DOMContentLoaded', async () => {
      // Элементы книги
      const loadingScreen = document.getElementById('loadingScreen');
      const bookTitleLeft = document.getElementById('bookTitleLeft');
      const chapterTitleLeft = document.getElementById('chapterTitleLeft');
      const bookTextLeft = document.getElementById('bookTextLeft');
      const bookTextRight = document.getElementById('bookTextRight');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const pageIndicator = document.getElementById('pageIndicator');

      // Элементы отзывов
      const starRating = document.getElementById('starRating');
      const stars = starRating.querySelectorAll('.star');
      const reviewText = document.getElementById('reviewText');
      const submitReviewBtn = document.getElementById('submitReview');
      const reviewsList = document.getElementById('reviewsList');

      const currentBookStr = localStorage.getItem('currentBook');
      if (!currentBookStr) {
        window.location.href = 'shelf.html';
        return;
      }

      const currentBook = JSON.parse(currentBookStr);
      bookTitleLeft.textContent = currentBook.title;
      document.title = `Библиотека | ${currentBook.title}`;

      let chapters = [];
      let currentChapterIndex = 0;
      let userId = null;
      let librarianName = "Странник"; // По умолчанию

      // Получаем имя пользователя для отзывов
      auth.onAuthStateChanged(async (user) => {
        if (!user) {
          window.location.href = 'index.html';
          return;
        }
        userId = user.uid;
        
        // Пытаемся получить ник из базы
        try {
          const userRef = ref(db, `users/${userId}/nickname`);
          const snap = await get(userRef);
          if (snap.exists()) librarianName = snap.val();
        } catch (e) {}

        // Загружаем закладку
        loadBookmark();
        // Загружаем отзывы
        loadReviews();
      });

      // 1. ЗАГРУЗКА ТЕКСТА
      try {
        const encodedTitle = encodeURIComponent(currentBook.title);
        const filePath = `books/${encodedTitle}.txt`;

        const response = await fetch(filePath);
        if (!response.ok) throw new Error('Файл не найден');

        const text = await response.text();
        
        chapters = text.split(/(?=Глава\s+\d+)/i);
        if (chapters.length <= 1) chapters = [text];
        else if (chapters[0].trim() === '') chapters.shift();

        loadingScreen.style.display = 'none';
        renderPage();

      } catch (error) {
        loadingScreen.innerHTML = `
          <div style="text-align: center; padding: 20px;">
            <div style="font-size: 1.5rem; margin-bottom: 10px;">Текст не найден</div>
            <div style="font-size: 0.9rem; color: #a00; margin-bottom: 15px;">
              Путь: books/${currentBook.title}.txt<br><br>
              ⚠️ Браузер блокирует чтение файлов с диска. Используйте <b>Live Server</b>.
            </div>
          </div>
        `;
      }

      // 2. ЗАКЛАДКИ
      async function loadBookmark() {
        if (!userId) return;
        try {
          const bookmarkRef = ref(db, `bookmarks/${userId}/${currentBook.id}`);
          const snapshot = await get(bookmarkRef);
          if (snapshot.exists()) {
            const savedChapter = snapshot.val();
            if (savedChapter > 0 && savedChapter < chapters.length) {
              currentChapterIndex = savedChapter;
              renderPage();
            }
          }
        } catch (e) {}
      }

      // 3. ОТРИСОВКА КНИГИ
      function renderPage() {
        if (chapters.length === 0) return;

        const chapterText = chapters[currentChapterIndex];
        const match = chapterText.match(/^(Глава\s+\d+[^\n]*)([\s\S]*)/i);
        
        let titleText = '';
        let bodyText = chapterText;

        if (match) {
          titleText = match[1].trim();
          bodyText = match[2].trim();
        }

        chapterTitleLeft.textContent = titleText;

        let paragraphs = bodyText.split('\n').filter(p => p.trim() !== '');
        let htmlParagraphs = paragraphs.map(p => `<p>${p.trim()}</p>`);

        if (htmlParagraphs.length > 0) {
          let firstPara = htmlParagraphs[0];
          firstPara = firstPara.replace(/<p>([^<])/, '<p><span class="drop-cap">$1</span>');
          htmlParagraphs[0] = firstPara;
        }

        const half = Math.ceil(htmlParagraphs.length / 2);
        const leftHtml = htmlParagraphs.slice(0, half).join('');
        const rightHtml = htmlParagraphs.slice(half).join('');

        bookTextLeft.style.opacity = '0';
        bookTextRight.style.opacity = '0';
        
        setTimeout(() => {
          bookTextLeft.innerHTML = leftHtml;
          bookTextRight.innerHTML = rightHtml || '';
          
          bookTextLeft.style.opacity = '1';
          bookTextRight.style.opacity = '1';
          
          document.querySelector('.left .page-content').scrollTop = 0;
          document.querySelector('.right .page-content').scrollTop = 0;
        }, 200);

        pageIndicator.textContent = `Глава ${currentChapterIndex + 1} / ${chapters.length}`;
        prevBtn.disabled = currentChapterIndex === 0;
        nextBtn.disabled = currentChapterIndex === chapters.length - 1;

        saveBookmark(currentChapterIndex);
      }

      async function saveBookmark(index) {
        if (!userId || !currentBook.id) return;
        try {
          await set(ref(db, `bookmarks/${userId}/${currentBook.id}`), index);
        } catch (e) {}
      }

      prevBtn.addEventListener('click', () => {
        if (currentChapterIndex > 0) {
          currentChapterIndex--;
          renderPage();
        }
      });

      nextBtn.addEventListener('click', () => {
        if (currentChapterIndex < chapters.length - 1) {
          currentChapterIndex++;
          renderPage();
        }
      });

      // ==========================================
      // 4. ЛОГИКА ОТЗЫВОВ
      // ==========================================
      let currentRating = 0;

      stars.forEach(star => {
        star.addEventListener('mouseenter', () => highlightStars(parseInt(star.dataset.value)));
        star.addEventListener('mouseleave', () => highlightStars(currentRating));
        star.addEventListener('click', () => {
          currentRating = parseInt(star.dataset.value);
          highlightStars(currentRating);
        });
      });

      function highlightStars(rating) {
        stars.forEach(s => {
          if (parseInt(s.dataset.value) <= rating) {
            s.classList.add('active');
          } else {
            s.classList.remove('active');
          }
        });
      }

      // Отправка отзыва
      submitReviewBtn.addEventListener('click', async () => {
        const text = reviewText.value.trim();
        
        if (currentRating === 0) {
          alert('Поставьте оценку книге!');
          return;
        }
        if (text === '') {
          alert('Напишите пару слов.');
          return;
        }

        submitReviewBtn.disabled = true;
        submitReviewBtn.textContent = 'Записываем...';

        try {
          const reviewsRef = ref(db, `reviews/${currentBook.id}`);
          await push(reviewsRef, {
            author: librarianName,
            rating: currentRating,
            text: text,
            date: Date.now()
          });

          // Очищаем форму
          reviewText.value = '';
          currentRating = 0;
          highlightStars(0);
          
        } catch (error) {
          alert('Ошибка отправки: ' + error.message);
        } finally {
          submitReviewBtn.disabled = false;
          submitReviewBtn.textContent = 'Оставить отзыв';
        }
      });

      // Загрузка отзывов
      function loadReviews() {
        const reviewsRef = ref(db, `reviews/${currentBook.id}`);
        
        // Слушаем изменения в реальном времени
        onValue(reviewsRef, (snapshot) => {
          reviewsList.innerHTML = '';
          
          if (!snapshot.exists()) {
            reviewsList.innerHTML = '<div style="text-align: center; opacity: 0.5; padding: 20px;">Пока нет отзывов. Будьте первым!</div>';
            return;
          }

          const reviews = snapshot.val();
          // Преобразуем объект в массив и сортируем по дате
          const reviewsArray = Object.values(reviews).sort((a, b) => b.date - a.date);

          reviewsArray.forEach(review => {
            const card = document.createElement('div');
            card.className = 'review-card';
            
            const dateStr = new Date(review.date).toLocaleDateString('ru-RU');
            const starsStr = '★'.repeat(review.rating) + '☆'.repeat(5 - review.rating);

            card.innerHTML = `
              <div class="review-header">
                <span class="review-author">${review.author}</span>
                <span class="review-stars">${starsStr}</span>
              </div>
              <div class="review-text">${review.text}</div>
              <div style="font-size: 0.7rem; opacity: 0.5; margin-top: 5px;">${dateStr}</div>
            `;
            reviewsList.appendChild(card);
          });
        });
      }
    });
  </script>
</body>
</html>
